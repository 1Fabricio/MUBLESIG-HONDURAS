        <main>
            <form action="/enviar" method="post">

                <li><label for="rtn">RTN</label>

                <li><label for="contacto">Contacto</label>
                <input type="number" name="cantidad" min="1" max="20"></li>

               <li><label for="acepto">Acepto los términos</label>

                <li><label for="nombre">Departamento de entraga: </label>
                <select name="entrega">
                    <option value="">Seleccione...</option>
                    <option value="16/20">Comayagua</option>
                    <option value="21/25">Francisco Morazán</option>
                    <option value="21/25">Cortés</option>
                    <option value="21/25">La Paz</option>
                    <option value="21/25">Atlantidad</option>
                    <option value="21/25">Islas de la Bahía</option>
                </select></li>


                <button type="submit">Enviar</button>
                <button type="submit">Limpiar</button>
                </ul>
            </form>
